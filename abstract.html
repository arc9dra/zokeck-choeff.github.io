    <h1>Abstract 9</h1>

      <!-- Every drawing opens at full resolution: the page shows them
           small enough to sit in the layout, so a way back to the real
           file has to exist. See .viewer - CSS only, no script. -->
      <!-- The three companion sheets as a filmstrip rather than a 3-up
           grid. Thirds made each drawing too small to read the line
           work; a horizontal scroll-snap strip gives each sheet most of
           the column and lets the next one show at the edge, which says
           "there is more here" without a caption saying so. -->

      <figure>
        <a class="zoom" href="#view-01">
          <img src="media/abstract_01.jpg"
               alt="A spiral-bound sketchpad page covered edge to edge in dense black pen marks, with a darker knot of overdrawn line gathering near the centre and thinning out toward the margins.">
        </a>
      </figure>
      <figure>
        <ul class="strip">
          <li class="strip__item"><a class="zoom" href="#view-02">
            <img src="media/abstract_02.jpg" alt="Pen drawing on a sketchpad page: an all-over field of small linked forms radiating outward, with a heavy black mass worked into the lower left corner."></a></li>
          <li class="strip__item"><a class="zoom" href="#view-03">
            <img src="media/abstract_03.jpg" alt="Pen drawing on a sketchpad page: an even all-over field of small creature-like figures and loops, densest through the middle band."></a></li>
          <li class="strip__item"><a class="zoom" href="#view-04">
            <img src="media/abstract_04.jpg" alt="Pen drawing on a sketchpad page: spiky angular forms scattered across the sheet, opening into a lighter clearing left of centre."></a></li>
        </ul>
      </figure>
