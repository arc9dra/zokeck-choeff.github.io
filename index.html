<main id="main" class="home">

  <!-- A water molecule: one oxygen, two hydrogens, at the real bond
       angle (about 104.5 degrees) rather than a flat right angle.
       The atoms and bonds are the original drawing. Around each atom is
       its electron shell, thinner than the atom itself so it reads as
       the quieter layer, with electrons riding on it - six valence
       electrons for the oxygen, one each for the hydrogens. The shells
       overlap where the atoms bond, which is the point of showing them.
       The electrons are filled in --paper and drawn LAST, so the shell
       line stops at each one instead of running straight through it -
       they sit on the ring rather than behind it.
       The letters are deliberately small and set in --muted: they label
       the drawing without competing with it.
       Inline SVG rather than a file so it takes currentColor and reads
       in both light and dark mode with no second asset. -->
  <figure class="home__art">
    <svg class="molecule" role="img" focusable="false" viewBox="0 0 460 250"
         aria-label="A water molecule: one oxygen atom bonded to two hydrogen atoms, each atom ringed by its electron shell with electrons sitting on the rings.">

      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- the shells: the quieter layer -->
        <g stroke-width="3">
          <circle cx="230.0" cy="100.0" r="76"/>
          <circle cx="127.2" cy="179.6" r="56"/>
          <circle cx="332.8" cy="179.6" r="56"/>
        </g>

        <!-- the molecule itself -->
        <g stroke-width="5">
          <path d="M196.8 125.7 L147.8 163.7"/>
          <path d="M263.2 125.7 L312.2 163.7"/>
          <circle cx="230.0" cy="100.0" r="42"/>
          <circle cx="127.2" cy="179.6" r="26"/>
          <circle cx="332.8" cy="179.6" r="26"/>
        </g>
      </g>

      <!-- electrons last, opaque, so nothing shows through them -->
      <g fill="var(--paper)" stroke="currentColor" stroke-width="3">
        <circle cx="306.0" cy="100.0" r="9"/>
        <circle cx="256.0" cy="171.4" r="9"/>
        <circle cx="204.0" cy="171.4" r="9"/>
        <circle cx="154.0" cy="100.0" r="9"/>
        <circle cx="204.0" cy="28.6" r="9"/>
        <circle cx="256.0" cy="28.6" r="9"/>
        <circle cx="82.9" cy="213.9" r="9"/>
        <circle cx="377.1" cy="213.9" r="9"/>
      </g>

      <g fill="var(--muted)" stroke="none" text-anchor="middle" font-weight="400">
        <text x="230.0" y="100.0" font-size="28" dy="0.35em">O</text>
        <text x="127.2" y="179.6" font-size="18" dy="0.35em">H</text>
        <text x="332.8" y="179.6" font-size="18" dy="0.35em">H</text>
      </g>
    </svg>
  </figure>
