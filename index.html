<main id="main" class="home">

  <!-- A water molecule, drawn to be chemically correct.
       Oxygen carries TWO shells: an inner one with 2 electrons and an
       outer one with 6. Each hydrogen has one shell.
       Two of those six outer electrons are placed on an actual
       intersection of the oxygen's outer shell with a hydrogen shell,
       so each sits on BOTH rings at once - that is the shared pair, and
       it is why the hydrogen rings are drawn overlapping rather than
       merely touching. The oxygen reaches its octet: 6 of its own plus
       the 2 shared in from the hydrogens.
       The other four outer electrons are the two lone pairs, kept on
       the far side from the bonds, where they actually sit.
       Bond angle is the real 104.5 degrees. Electrons are filled in
       --paper and drawn last so no ring runs through them. Letters are
       small and --muted: they label without competing.
       Inline SVG so it takes currentColor and serves both modes. -->
  <figure class="home__art">
    <svg class="molecule" role="img" focusable="false" viewBox="0 0 460 250"
         aria-label="A water molecule as a Bohr diagram: an oxygen atom with two electron shells, two electrons on the inner and six on the outer, bonded to two hydrogen atoms whose shells overlap the oxygen's outer shell at a shared electron.">

      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- the shells: the quieter layer -->
        <g stroke-width="3">
          <circle cx="230.0" cy="110.0" r="52"/>
          <circle cx="230.0" cy="110.0" r="84"/>
          <circle cx="132.0" cy="185.9" r="48"/>
          <circle cx="328.0" cy="185.9" r="48"/>
        </g>

        <!-- the molecule itself -->
        <g stroke-width="5">
          <path d="M206.3 128.4 L149.3 172.4"/>
          <path d="M253.7 128.4 L310.7 172.4"/>
          <circle cx="230.0" cy="110.0" r="30"/>
          <circle cx="132.0" cy="185.9" r="22"/>
          <circle cx="328.0" cy="185.9" r="22"/>
        </g>
      </g>

      <!-- electrons last, opaque, so nothing shows through them -->
      <g fill="var(--paper)" stroke="currentColor" stroke-width="3">
        <circle cx="230.0" cy="162.0" r="9"/>
        <circle cx="230.0" cy="58.0" r="9"/>
        <circle cx="153.9" cy="74.5" r="9"/>
        <circle cx="201.3" cy="31.1" r="9"/>
        <circle cx="258.7" cy="31.1" r="9"/>
        <circle cx="306.1" cy="74.5" r="9"/>
        <circle cx="152.6" cy="142.6" r="9"/>
        <circle cx="307.4" cy="142.6" r="9"/>
      </g>

      <g fill="var(--muted)" stroke="none" text-anchor="middle" font-weight="400">
        <text x="230.0" y="110.0" font-size="24" dy="0.35em">O</text>
        <text x="132.0" y="185.9" font-size="15" dy="0.35em">H</text>
        <text x="328.0" y="185.9" font-size="15" dy="0.35em">H</text>
      </g>
    </svg>
  </figure>
