<main id="main" class="home">

  <!-- A water molecule: one oxygen, two hydrogens, set at the real
       bond angle (about 104.5 degrees) rather than a flat right angle.
       Stroke weight and round caps match the line work elsewhere on the
       site. Inline SVG rather than a file so it takes currentColor and
       reads correctly in both light and dark mode with no second asset. -->
  <figure class="home__art">
    <svg class="molecule" role="img" focusable="false" viewBox="0 0 460 250"
         aria-label="A water molecule: one oxygen atom bonded to two hydrogen atoms.">

      <g fill="none" stroke="currentColor" stroke-width="6"
         stroke-linecap="round" stroke-linejoin="round">
        <!-- bonds first, drawn circle-edge to circle-edge so the strokes
             meet the atoms cleanly instead of running under them -->
        <path d="M190.5 122.6 L143 159.3"/>
        <path d="M269.5 122.6 L317 159.3"/>
        <!-- oxygen -->
        <circle cx="230" cy="92" r="50"/>
        <!-- the two hydrogens -->
        <circle cx="119.3" cy="177.7" r="30"/>
        <circle cx="340.7" cy="177.7" r="30"/>
      </g>

      <g fill="currentColor" stroke="none" font-weight="700" text-anchor="middle">
        <text x="230"   y="92"    font-size="46" dy="0.35em">O</text>
        <text x="119.3" y="177.7" font-size="28" dy="0.35em">H</text>
        <text x="340.7" y="177.7" font-size="28" dy="0.35em">H</text>
      </g>
    </svg>
  </figure>
